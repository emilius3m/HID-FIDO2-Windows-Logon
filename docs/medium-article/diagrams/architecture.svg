<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="806" viewBox="0 0 1160 806" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect width="1160" height="806" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fb5"/></marker></defs><text x="40" y="48" font-size="24" font-weight="600" fill="#1f2328" text-anchor="start">Two programs, one key, one vault: Windows still decides</text><text x="40" y="80" font-size="16" font-weight="400" fill="#57606a" text-anchor="start">Setup runs in the native manager; sign-in runs inside the Windows logon screen.</text><rect x="40" y="296" width="140" height="80" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="110.0" y="342.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">You</text><rect x="240" y="120" width="280" height="96" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="380.0" y="162.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Native manager</text><text x="380.0" y="186.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">enrollment · status · install</text><rect x="600" y="120" width="520" height="96" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="860.0" y="162.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Vault helper</text><text x="860.0" y="186.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">PIN and password dialogs · FIDO2 enrollment (elevated)</text><rect x="600" y="290" width="245" height="96" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="722.5" y="332.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">USB FIDO2 security key</text><text x="722.5" y="356.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">PIN · touch · hmac-secret</text><rect x="875" y="290" width="245" height="96" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="997.5" y="320.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Encrypted vault</text><text x="997.5" y="344.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">AES-256-GCM</text><text x="997.5" y="365.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">SYSTEM and Admins only</text><rect x="600" y="460" width="520" height="96" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="860.0" y="502.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Credential Provider</text><text x="860.0" y="526.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">DLL loaded by LogonUI · PIN field · unlock hand-off</text><rect x="600" y="640" width="520" height="96" rx="10" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="2"/><text x="860.0" y="682.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Windows authentication</text><text x="860.0" y="706.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">Negotiate / LSA · grants or refuses access</text><path d="M110 296 L110 168 L240 168" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><path d="M110 376 L110 508 L600 508" fill="none" stroke="#2f6fb5" stroke-width="2" marker-end="url(#b)"/><path d="M520 168 L600 168" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><path d="M722 216 L722 290" fill="none" stroke="#8c959f" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><path d="M997 216 L997 290" fill="none" stroke="#8c959f" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><path d="M722 460 L722 386" fill="none" stroke="#2f6fb5" stroke-width="2" marker-start="url(#b)" marker-end="url(#b)"/><path d="M997 460 L997 386" fill="none" stroke="#2f6fb5" stroke-width="2" marker-start="url(#b)" marker-end="url(#b)"/><path d="M860 556 L860 640" fill="none" stroke="#2f6fb5" stroke-width="2" marker-end="url(#b)"/><text x="122" y="240" font-size="14" font-weight="400" fill="#57606a" text-anchor="start">manage</text><text x="122" y="450" font-size="14" font-weight="600" fill="#2f6fb5" text-anchor="start">sign in</text><text x="560" y="158" font-size="14" font-weight="400" fill="#57606a" text-anchor="middle">runs</text><text x="874" y="604" font-size="14" font-weight="600" fill="#2f6fb5" text-anchor="start">CredProtect-protected password</text><text x="240" y="262" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="start">Once, as administrator: enroll two</text><text x="240" y="284" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="start">keys, store the password, install.</text><text x="240" y="544" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="start">Every sign-in: key PIN and a touch;</text><text x="240" y="566" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="start">the Windows password is never typed.</text><line x1="40" y1="776" x2="70" y2="776" stroke="#8c959f" stroke-width="1.6"/><text x="80" y="781" font-size="14" font-weight="400" fill="#57606a" text-anchor="start">setup and management</text><line x1="270" y1="776" x2="300" y2="776" stroke="#2f6fb5" stroke-width="2"/><text x="310" y="781" font-size="14" font-weight="400" fill="#57606a" text-anchor="start">sign-in and unlock</text></svg>