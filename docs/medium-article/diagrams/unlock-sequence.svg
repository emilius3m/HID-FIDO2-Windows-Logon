<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1046" viewBox="0 0 1200 1046" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect width="1200" height="1046" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fb5"/></marker></defs><text x="40" y="48" font-size="24" font-weight="600" fill="#1f2328" text-anchor="start">Sixteen steps from key verification to Windows authentication</text><text x="40" y="80" font-size="16" font-weight="400" fill="#57606a" text-anchor="start">Solid arrows are requests, dashed arrows are answers. Timing varies with the device and touch.</text><line x1="110" y1="166" x2="110" y2="1016" stroke="#d0d7de" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="30" y="110" width="160" height="56" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="110" y="144" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">You</text><line x1="300" y1="166" x2="300" y2="1016" stroke="#d0d7de" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="220" y="110" width="160" height="56" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="300" y="134" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Sign-in screen</text><text x="300" y="154" font-size="14" font-weight="400" fill="#57606a" text-anchor="middle">(LogonUI)</text><line x1="500" y1="166" x2="500" y2="1016" stroke="#d0d7de" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="420" y="110" width="160" height="56" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="500" y="134" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">HID FIDO2</text><text x="500" y="154" font-size="14" font-weight="400" fill="#57606a" text-anchor="middle">provider</text><line x1="700" y1="166" x2="700" y2="1016" stroke="#d0d7de" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="620" y="110" width="160" height="56" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="700" y="134" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">FIDO2</text><text x="700" y="154" font-size="14" font-weight="400" fill="#57606a" text-anchor="middle">security key</text><line x1="900" y1="166" x2="900" y2="1016" stroke="#d0d7de" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="820" y="110" width="160" height="56" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="900" y="134" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Encrypted</text><text x="900" y="154" font-size="14" font-weight="400" fill="#57606a" text-anchor="middle">vault</text><line x1="1090" y1="166" x2="1090" y2="1016" stroke="#d0d7de" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="1010" y="110" width="160" height="56" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="1090" y="134" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Windows</text><text x="1090" y="154" font-size="14" font-weight="400" fill="#57606a" text-anchor="middle">authentication</text><path d="M114 202 L296 202" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><text x="205.0" y="194" font-size="15" font-weight="400" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">1  Enter key PIN, Sign in</text><path d="M304 254 L496 254" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><text x="400.0" y="246" font-size="15" font-weight="400" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">2  Ask for a credential</text><rect x="390.0" y="282" width="220" height="34" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="500" y="305" font-size="15" font-weight="400" fill="#1f2328" text-anchor="middle">3  Local checks first</text><path d="M504 358 L696 358" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><text x="600.0" y="350" font-size="15" font-weight="400" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">4  Fresh ECDH shared secret</text><path d="M504 410 L696 410" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><text x="600.0" y="402" font-size="15" font-weight="400" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">5  Encrypted PIN hash</text><path d="M696 462 L504 462" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="600.0" y="454" font-size="15" font-weight="400" fill="#57606a" text-anchor="middle" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">6  Encrypted PIN token</text><path d="M504 514 L696 514" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><text x="600.0" y="506" font-size="15" font-weight="400" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">7  Challenge + encrypted salt</text><path d="M114 566 L696 566" fill="none" stroke="#2f6fb5" stroke-width="2.2" marker-end="url(#b)"/><text x="400.0" y="558" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">8  Touch the key</text><path d="M696 618 L504 618" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="600.0" y="610" font-size="15" font-weight="400" fill="#57606a" text-anchor="middle" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">9  Signed answer + encrypted output</text><rect x="335.0" y="646" width="330" height="34" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="500" y="669" font-size="15" font-weight="400" fill="#1f2328" text-anchor="middle">10  Verify signature, PIN, touch, counter</text><path d="M504 722 L896 722" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><text x="700.0" y="714" font-size="15" font-weight="400" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">11  Derived output unwraps data key</text><path d="M504 774 L896 774" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><text x="700.0" y="766" font-size="15" font-weight="400" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">12  Persist verified counter</text><path d="M896 826 L504 826" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="700.0" y="818" font-size="15" font-weight="400" fill="#57606a" text-anchor="middle" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">13  Password, memory only</text><path d="M496 878 L304 878" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="400.0" y="870" font-size="15" font-weight="400" fill="#57606a" text-anchor="middle" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">14  Protected password serialization</text><path d="M304 930 L1086 930" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><text x="695.0" y="922" font-size="15" font-weight="400" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">15  Standard password check</text><path d="M1086 982 L304 982" fill="none" stroke="#2f6fb5" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#b)"/><text x="695.0" y="974" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">16  Access granted or refused</text></svg>