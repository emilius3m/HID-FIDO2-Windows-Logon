<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect width="1400" height="788" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fb5"/></marker></defs><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a7cc4"/><stop offset="1" stop-color="#1f4f8a"/></linearGradient></defs><rect x="0" y="0" width="1400" height="788" fill="#f6f8fa"/><rect x="120" y="234" width="320" height="320" rx="64" fill="url(#g)"/><circle cx="220" cy="394" r="46" fill="none" stroke="#ffffff" stroke-width="34"/><rect x="260" y="377" width="140" height="34" fill="#ffffff"/><rect x="356" y="411" width="20" height="38" fill="#ffffff"/><rect x="382" y="411" width="18" height="26" fill="#ffffff"/><text x="540" y="282" font-size="22" font-weight="600" fill="#2f6fb5" text-anchor="start">A STORY ABOUT CODING AGENTS</text><text x="540" y="356" font-size="50" font-weight="700" fill="#1f2328" text-anchor="start">One key, one PIN, one touch,</text><text x="540" y="420" font-size="50" font-weight="700" fill="#1f2328" text-anchor="start">and 13,000 lines of C++</text><text x="540" y="486" font-size="25" font-weight="400" fill="#57606a" text-anchor="start">FIDO2 sign-in for Windows that I could never</text><text x="540" y="520" font-size="25" font-weight="400" fill="#57606a" text-anchor="start">have built on my own.</text></svg>