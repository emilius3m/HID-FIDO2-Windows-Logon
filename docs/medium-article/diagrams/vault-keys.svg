<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="520" viewBox="0 0 1230 520" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect width="1230" height="520" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fb5"/></marker></defs><text x="40" y="48" font-size="24" font-weight="600" fill="#1f2328" text-anchor="start">Either key opens the vault; neither key ever sees the password</text><text x="40" y="80" font-size="16" font-weight="400" fill="#57606a" text-anchor="start">One random data key encrypts the password; each security key wraps that same data key.</text><rect x="385" y="105" width="815" height="330" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="7 6"/><text x="405" y="134" font-size="15" font-weight="600" fill="#57606a" text-anchor="start">Machine vault (vault.bin) - SYSTEM and Administrators only</text><rect x="40" y="150" width="260" height="100" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="170.0" y="182.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Primary security key</text><text x="170.0" y="206.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">hmac-secret stays inside</text><text x="170.0" y="227.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">gives a per-key secret</text><rect x="40" y="300" width="260" height="100" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="170.0" y="332.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Backup security key</text><text x="170.0" y="356.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">hmac-secret stays inside</text><text x="170.0" y="377.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">gives a per-key secret</text><rect x="415" y="160" width="240" height="80" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="535.0" y="194.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Wrapped data key #1</text><text x="535.0" y="218.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">HKDF + AES-256-GCM</text><rect x="415" y="310" width="240" height="80" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="535.0" y="344.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Wrapped data key #2</text><text x="535.0" y="368.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">HKDF + AES-256-GCM</text><rect x="720" y="230" width="200" height="90" rx="10" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="2"/><text x="820.0" y="269.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Data key</text><text x="820.0" y="293.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">256-bit, random</text><rect x="970" y="215" width="210" height="120" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/><text x="1075.0" y="245.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Windows password</text><text x="1075.0" y="269.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">AES-256-GCM</text><text x="1075.0" y="290.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">bound to account</text><text x="1075.0" y="311.0" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle">and record</text><path d="M300 200 L415 200" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><path d="M300 350 L415 350" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><path d="M655 200 L690 200 L690 260 L720 260" fill="none" stroke="#2f6fb5" stroke-width="2" marker-end="url(#b)"/><path d="M655 350 L690 350 L690 290 L720 290" fill="none" stroke="#2f6fb5" stroke-width="2" marker-end="url(#b)"/><path d="M920 275 L970 275" fill="none" stroke="#2f6fb5" stroke-width="2" marker-end="url(#b)"/><text x="342" y="190" font-size="14" font-weight="400" fill="#57606a" text-anchor="middle">unwraps</text><text x="342" y="340" font-size="14" font-weight="400" fill="#57606a" text-anchor="middle">unwraps</text><text x="945" y="262" font-size="14" font-weight="600" fill="#2f6fb5" text-anchor="middle">opens</text><text x="40" y="472" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">A password change re-encrypts only the password: both key wrappers stay valid,</text><text x="40" y="498" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">so updating it needs just one of the two keys.</text></svg>